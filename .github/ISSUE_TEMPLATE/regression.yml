name: Hidden evidence or behavioral regression
description: Report changed source, hidden diagnostics, wrong exits or broken helper behavior.
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal sanitized reproducer
      description: Include exact argv and a synthetic fixture; omit secrets and customer data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include exit status and whether raw logs were explicitly saved.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Month End version, Python version and OS
    validations:
      required: true
