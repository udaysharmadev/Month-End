[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
files = ["skills/month-end/scripts", "scripts"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".cache", "dist"]
